name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: audit_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://audit_app:admin@localhost:5432/audit_network
      AUDIT_NETWORK_TEST_DATABASE_URL: postgresql://audit_app:admin@localhost:5432/audit_network_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Aligned with the local venv (py3.12) — Q5.
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Initialize native PostgreSQL roles and extensions
        env:
          PGPASSWORD: admin
        run: |
          psql -h localhost -U postgres -d audit_network -f scripts/init-native-postgres.sql
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE audit_app PASSWORD 'admin';"
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE audit_migrator PASSWORD 'admin';"
          psql -h localhost -U postgres -d postgres -c "ALTER DATABASE audit_network OWNER TO audit_migrator;"
          # Test database must be a separate database (Q5/D7): never reuse the
          # main database for pytest.
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS audit_network_test;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE audit_network_test OWNER audit_migrator;"
          psql -h localhost -U postgres -d audit_network_test -c "GRANT ALL ON SCHEMA public TO audit_app;"
          # Extensions must be created in the *test* database too, and only a
          # superuser may create `vector` (pgvector is not a trusted extension).
          # scripts/init-test-postgres.ps1 does this locally, but it is
          # PowerShell and cannot run on an ubuntu runner, so without this line
          # migration 0001 fails with
          #   permission denied to create extension "vector"
          # while the main database migrates fine — the asymmetry is easy to miss.
          psql -h localhost -U postgres -d audit_network_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations (main database)
        env:
          DATABASE_URL: postgresql://audit_migrator:admin@localhost:5432/audit_network
        run: python -m alembic -c alembic.ini upgrade head
      - name: Apply migrations (test database)
        env:
          DATABASE_URL: postgresql://audit_migrator:admin@localhost:5432/audit_network_test
        run: python -m alembic -c alembic.ini upgrade head
      # Migrations alone are not a usable database.  The project's own seed step
      # provisions what many suites assert on: the `demo-execution-allow` policy
      # set (scheduler.a/b/c), a published workflow version, demo missions that
      # really ran through the executor, and the AIOps/quant/audit guards.
      # Locally this had always been run by hand, so the suite only ever passed
      # on a seeded database — CI reproduced the schema and nothing else, and
      # those tests failed.  scripts/seed-demo.ps1 is a thin PowerShell wrapper
      # around exactly this call; ubuntu cannot run it, hence the direct call.
      - name: Seed demo data (test database)
        env:
          DATABASE_URL: postgresql://audit_app:admin@localhost:5432/audit_network_test
        run: python -c "import os; from packages.demo.seed import seed_local_demo; print(seed_local_demo(os.environ['DATABASE_URL']))"
      - name: Install web dependencies
        run: npm install
      # The desktop console is the only user-facing entry point the README
      # documents, yet nothing here exercised it: the root `npm test` script runs
      # `vitest run web/src` and the root tsconfig only includes `web/src/**`, so
      # desktop/ was silently uncovered.  `desktop:test` / `desktop:typecheck`
      # existed in package.json but no job ever called them.
      #
      # ELECTRON_SKIP_BINARY_DOWNLOAD: these gates only typecheck and run unit
      # tests, so the ~100 MB Electron binary is not needed and skipping it
      # removes the most network-dependent, most flaky part of the install.
      # Drop this if a future step needs to launch or package the app.
      - name: Install desktop dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --prefix desktop
      - name: Verify quality gates
        run: |
          python -m pytest -q
          python -m ruff check apps packages tests
          python -m mypy packages
          npm test
          npm run typecheck
          npm --prefix desktop run typecheck
          npm --prefix desktop run test
