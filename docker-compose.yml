# 起全栈（服务器部署 / 网页入口）：
#
#     docker compose up -d postgres                     # 1. 只起数据库
#     docker compose --profile migrate run --rm migrate # 2. 显式迁移 + 初始数据
#     docker compose up -d                              # 3. 校验版本后起 api + worker
#     # 打开 http://127.0.0.1:8010/
#
# 第 2 步不能省，也不能塞进 `up`：项目约束要求数据库迁移必须显式执行，
# 不允许应用启动时自动升级（见 AGENTS.md）。`init` 只做只读版本检查，
# 结构落后时拒绝放行 api/worker，并把该跑的命令打印出来。
#
# 桌面安装版不需要本文件——它自带便携 Python 与 PostgreSQL，双击即用。
# 本文件只是环境适配器，不得成为应用代码的依赖。
#
# 服务分工：
#   postgres  带 pgvector 的 PostgreSQL 16。扩展与角色由 init-docker-postgres.sql
#             在首次建库时创建（迁移 0001 需要超级用户建 vector 扩展）。
#   init      一次性任务：只读检查迁移版本，成功后退出，不做任何写操作。
#             api / worker 用 `service_completed_successfully` 等它，避免抢跑。
#   migrate   一次性任务，仅 migrate profile：迁移 → 示例数据 → 插件注册 → 图谱索引。
#   api       控制平面 HTTP 服务，同时把 web/ 挂在 /（网页入口）。
#   worker    后台执行器：心跳、组网触发、DAG 重试。

name: audit-network

x-app: &app
  image: audit-network:local
  # build 只写在 api 一个服务上。三个服务共用同一镜像标签时，若各自声明 build，
  # BuildKit 会并行导出同一个标签并报 `image "audit-network:local": already exists`。
  environment: &app-env
    DATABASE_URL: postgresql://audit_app:admin@postgres:5432/audit_network
    AUDIT_NETWORK_DATA_DIR: /data

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: audit-network-postgres
    environment:
      POSTGRES_DB: audit_network
      POSTGRES_USER: audit_migrator
      # 仅本机开发用；与 .env.example、scripts/ 默认值、CI 保持一致。
      # 对外部署务必改掉，并同时改 api/worker 的 DATABASE_URL。
      POSTGRES_PASSWORD: admin
    ports:
      # 只发布到回环地址：库口令是开发默认值，不能顺带暴露到局域网。
      # 需要远程访问时请走带认证的反向代理，不要直接改回 0.0.0.0。
      - "127.0.0.1:54329:5432"
    volumes:
      - audit_network_pgdata:/var/lib/postgresql/data
      # 让容器自己建好扩展、角色和测试库。缺了这一步，仅启动容器是**不能迁移**的：
      # 迁移 0001 会在 `permission denied to create extension "vector"` 上失败。
      # scripts/init-native-postgres.sql 不能代替它——那个脚本假定库已存在，
      # 也刻意不设置密码。
      - ./scripts/init-docker-postgres.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_migrator -d audit_network"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    <<: *app
    container_name: audit-network-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      # 迁移用 migrator 账号；其余步骤用应用账号，验证真实权限边界。
      MIGRATOR_URL: postgresql://audit_migrator:admin@postgres:5432/audit_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[init] 只读检查：数据库结构版本"
        DATABASE_URL="$$MIGRATOR_URL" python scripts/check-db-revision.py
    restart: "no"

  migrate:
    <<: *app
    container_name: audit-network-migrate
    # 不参与普通 `up`：迁移只能显式触发。
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      MIGRATOR_URL: postgresql://audit_migrator:admin@postgres:5432/audit_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[migrate] 1/4 数据库迁移"
        DATABASE_URL="$$MIGRATOR_URL" python -m alembic upgrade head
        echo "[migrate] 2/4 示例数据"
        python -c "import os; from packages.demo.seed import seed_local_demo; print(seed_local_demo(os.environ['DATABASE_URL']))"
        echo "[migrate] 3/4 插件注册"
        python -m packages.plugin_runtime.registration --database-url "$$DATABASE_URL" --tenant-slug local-dev
        echo "[migrate] 4/4 能力图谱索引"
        python scripts/index-plugin-graph.py --database-url "$$DATABASE_URL" \
          --domain audit --domain aiops --domain quant --domain knowledge
        echo "[migrate] 完成"
    restart: "no"

  api:
    <<: *app
    container_name: audit-network-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8010:8010"
    # 探针只挂在 api 上。worker 用同一镜像但没有 HTTP 端点，继承镜像级探针
    # 会让它永远 unhealthy。
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      - audit_network_data:/data
    restart: unless-stopped

  worker:
    <<: *app
    container_name: audit-network-worker
    command: ["python", "-m", "apps.worker.local"]
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - audit_network_data:/data
    restart: unless-stopped

volumes:
  audit_network_pgdata:
  # 工件、草稿与日志。api 与 worker 共用，必须留在卷里而不是容器内。
  audit_network_data:
