[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-network"
version = "0.1.0"
description = "Long-running audit, quant and AIOps control plane"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23",
  "openpyxl>=3.1,<4",
  "psycopg2-binary>=2.9",
  "pydantic>=2.8",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-psycopg2>=2.9",
  "types-jsonschema>=4.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/全流程运行日志-20260912/10-驱动脚本` deliberately holds byte-for-byte
# copies of pre-existing scratch drivers from the (gitignored) `.data/`
# directory, archived so a run can be reproduced.  Linting them would mean
# editing them, which would destroy exactly the provenance the archive exists
# to provide — so the archive is excluded rather than "fixed".  Its own
# `校验清单-sha256.csv` pins every file's hash.
exclude = ["cankao", ".venv", "build", "dist", "docs/全流程运行日志-20260912"]

[tool.ruff.lint]
# ruff 0.16 起默认规则集显著扩大（SIM/UP/FLY/DTZ 等全量启用），会大面积
# 报出本项目历史里程碑未采用、且与本次改动无关的风格项；此处显式收敛到
# 项目既有基线（经典默认 E4/E7/E9/F + import 排序 I），保证 `ruff check .`
# 如实反映项目风格约束，不静默放宽也不伪造通过。
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "plugins*"]
exclude = ["cankao*", "tests*"]
